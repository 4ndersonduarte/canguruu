name: canguruu_finance
description: Gerenciador financeiro pessoal Canguruu, com dados locais.
publish_to: 'none'
version: 0.4.0+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: 2.9.4
  flutter_riverpod: 2.6.1
  go_router: ^17.2.3
  drift: 2.30.0
  drift_flutter: 0.2.8
  uuid: ^4.6.0
  intl: ^0.20.2
  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.30.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/OFL.txt
    - assets/fonts/Trocchi-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 100
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 900

    - family: Trocchi
      fonts:
        - asset: assets/fonts/Trocchi.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500
